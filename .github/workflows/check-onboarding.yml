name: Check onboarding

# Runs scripts/check-onboarding.sh by hand on any ref: every onboarding scene
# against its approved golden, and a first run through the real tour in a
# clean data folder. Release runs the same script before a stable release;
# run this on any pull request that changes the onboarding scenes or flow.
#
#   gh workflow run check-onboarding.yml --ref <branch> -f ref=<ref to check>
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to check
        required: true
        default: dev

permissions:
  contents: read

jobs:
  onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      BLA_VENDOR: OpenBLAS
      OPENSSL_NO_VENDOR: "1"
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install native libraries
        timeout-minutes: 15
        run: |
          # apt sometimes hangs for 20+ minutes: kill each try after 240 s, try up to 3 times.
          scripts/retry-timeout.sh 3 240 sh -c '
            sudo apt-get update &&
            sudo apt-get install -y clang cmake pkg-config python3 libasound2-dev \
            libssl-dev libgtk-3-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libxcursor-dev libxi-dev \
            libxrandr-dev libopenblas-dev libvulkan-dev glslc libshaderc-dev \
            mesa-vulkan-drivers'
      - name: Check onboarding
        run: |
          status=0
          scripts/check-onboarding.sh "$RUNNER_TEMP/onboarding" || status=$?
          cat "$RUNNER_TEMP/onboarding/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - name: Upload the scenes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: onboarding-scenes
          path: |
            ${{ runner.temp }}/onboarding
            /tmp/rune-settings-*-actual.png
          if-no-files-found: ignore
